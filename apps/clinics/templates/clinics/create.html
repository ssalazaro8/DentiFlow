{% extends "base.html" %}

{% block title %}New Clinic - DentiFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <i class="fas fa-hospital me-2"></i>Register New Clinic
            </div>
            <div class="card-body">
                <form method="post" class="df-plain-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <a class="btn btn-outline-secondary" href="{% url 'clinic_list' %}">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
