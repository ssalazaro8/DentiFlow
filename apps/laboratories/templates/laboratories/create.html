<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Laboratorio - DentiFlow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        h1 { color: #2c3e50; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        p { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; width: 100%; }
        .btn-save:hover { background-color: #219150; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #e74c3c; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Registrar Nuevo Laboratorio</h1>
        
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn-save">Guardar Laboratorio</button>
            <a href="{% url 'laboratory_list' %}" class="btn-cancel">Cancelar</a>
        </form>
    </div>

</body>
</html>
