{% extends "base.html" %}

{% block title %}Create Workflow - DentiFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <i class="fas fa-stream me-2"></i>Create Dental Case Workflow
            </div>
            <div class="card-body">
                <form method="post" class="df-plain-form">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <a class="btn btn-outline-secondary" href="{% url 'workflow_list' %}">
                        Back to Workflow List
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Create Workflow
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
