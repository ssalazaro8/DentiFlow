<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Workflow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .workflow-card {
            background-color: white;
            max-width: 500px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="workflow-card">

        <h1>Update Workflow</h1>

        <h2>
            Case: {{ workflow.case_number }}
        </h2>

        <p>
            Current status:
            <strong>
                {{ workflow.get_current_stage_display }}
            </strong>
        </p>

        <form method="post">

            {% csrf_token %}

            <label for="stage">
                New status:
            </label>

            <select name="stage" id="stage">

                {% for value, label in workflow.STAGE_CHOICES %}

                    <option
                        value="{{ value }}"
                        {% if workflow.current_stage == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

            <button type="submit">
                Update Status
            </button>

        </form>

        <a
            class="back-link"
            href="{% url 'workflow_list' %}"
        >
            Back to Workflow List
        </a>

    </div>

</body>
</html>
