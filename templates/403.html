{% extends "base.html" %}

{% block title %}Access denied - DentiFlow{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2><i class="fas fa-lock me-2"></i>Access denied</h2>

    <p>
        {% if exception %}
            {{ exception }}
        {% else %}
            You do not have permission to access this resource.
        {% endif %}
    </p>

    <a class="btn btn-outline-primary" href="{% url 'dental_case_list' %}">Back to cases</a>

</div>
{% endblock %}
