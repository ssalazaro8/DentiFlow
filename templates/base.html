<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DentiFlow{% endblock %}</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
        color: #1a1a1a;
    }
    header {
        background-color: #1a1a1a;
        color: white;
        padding: 16px 32px;
    }
    header h2 { margin: 0 0 8px 0; }
    nav a {
        color: #e5e5e5;
        text-decoration: none;
        margin-right: 16px;
        font-weight: 500;
    }
    nav a:hover { text-decoration: underline; }
    main {
        max-width: 900px;
        margin: 32px auto;
        padding: 24px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #1a1a1a; }
    a.button, button {
        display: inline-block;
        background-color: #1a1a1a;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 16px;
    }
    a.button:hover, button:hover { background-color: #404040; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
    }
    th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #d4d4d4;
    }
    th { background-color: #f0f0f0; color: #1a1a1a; }
    tr:hover { background-color: #fafafa; }
    form p { margin-bottom: 12px; }
    input, select {
        padding: 6px 10px;
        border: 1px solid #b0b0b0;
        border-radius: 4px;
        width: 100%;
        max-width: 400px;
    }
</style>

</head>
<body>
    <header>
        <h2>DentiFlow</h2>
<nav>
    {% if user.is_authenticated %}
        <span>Hola, {{ user.username }}</span> |
        <a href="/clinics/">Clinics</a>
        {% if user.groups.all|first %}
            ({{ user.groups.all|first }})
        {% endif %}
        {% if user.is_superuser %}
            <a href="/admin/">Admin Panel</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none;color:#e5e5e5;text-decoration:underline;border:none;padding:0;cursor:pointer;">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
