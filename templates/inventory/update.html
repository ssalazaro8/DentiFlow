{% extends "base.html" %}

{% block title %}Update Stock - DentiFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <i class="fas fa-cubes me-2"></i>Update Stock
            </div>
            <div class="card-body">

                <h2 class="h4 mb-1">{{ material.name }}</h2>

                <p class="text-muted">
                    Current stock:
                    {{ material.stock_quantity }}
                    {{ material.get_unit_type_display }}
                </p>

                <form method="post">
                    {% csrf_token %}

                    <label class="form-label" for="stock_quantity">
                        New stock quantity:
                    </label>

                    <input
                        class="form-control mb-3"
                        type="number"
                        id="stock_quantity"
                        name="stock_quantity"
                        value="{{ material.stock_quantity }}"
                        step="0.01"
                        min="0"
                        required
                    >

                    <a class="btn btn-outline-secondary" href="{% url 'material_list' %}">
                        Back to Inventory
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Update Stock
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
