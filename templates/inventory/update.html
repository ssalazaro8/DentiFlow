<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Stock</title>
</head>
<body>

    <h1>Update Stock</h1>

    <h2>{{ material.name }}</h2>

    <p>
        Current stock:
        {{ material.stock_quantity }}
        {{ material.get_unit_type_display }}
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="stock_quantity">
            New stock quantity:
        </label>

        <input
            type="number"
            id="stock_quantity"
            name="stock_quantity"
            value="{{ material.stock_quantity }}"
            step="0.01"
            min="0"
            required
        >

        <button type="submit">
            Update Stock
        </button>
    </form>

    <br>

    <a href="{% url 'material_list' %}">
        Back to Inventory
    </a>

</body>
</html>
